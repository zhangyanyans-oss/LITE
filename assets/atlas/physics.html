<h1>物理图库 · 人教版初中（实验装置 + 光路原理图）</h1>
<p class="lead">共 43 张 · 课堂上按 id 引用（figure 围栏）· 灰底卡片里是讲课时要照着说的装配/画法要点</p>
<h2>实验装置图（setup）<span>28</span></h2><div class='grid'><figure class="card"><img src="../../public/atlas/phy-001.png" alt="测量小车的平均速度·斜面装置">
<div class="meta"><b>phy-001</b> · 测量小车的平均速度·斜面装置</div>
<div class="asm">斜面坡度要小（延长下滑时间、便于计时）；金属片让小车在同一位置停下，使路程与时间对应；v=s/t，上半程/下半程/全程要分别测</div></figure><figure class="card"><img src="../../public/atlas/phy-010.png" alt="探究阻力对物体运动的影响·斜面与不同表面">
<div class="meta"><b>phy-010</b> · 探究阻力对物体运动的影响·斜面与不同表面</div>
<div class="asm">同一小车从同一斜面同一高度由静止滑下（到达水平面时初速度相同）；水平面越光滑，小车滑得越远；由此推理：若不受阻力将做匀速直线运动</div></figure><figure class="card"><img src="../../public/atlas/phy-018.png" alt="探究动能大小跟速度、质量的关系">
<div class="meta"><b>phy-018</b> · 探究动能大小跟速度、质量的关系</div>
<div class="asm">木块被撞后滑行的距离反映动能大小（转换法）；同一钢球从不同高度滑下改变速度，不同质量钢球从同一高度滑下改变质量（控制变量）</div></figure><figure class="card"><img src="../../public/atlas/phy-011.png" alt="探究二力平衡的条件">
<div class="meta"><b>phy-011</b> · 探究二力平衡的条件</div>
<div class="asm">通过改变两侧钩码数量改变拉力大小；把小车扭转一个角度后松手，看能否平衡（探究是否同一直线）；小卡片可忽略重力影响</div></figure><figure class="card"><img src="../../public/atlas/phy-012.png" alt="探究滑动摩擦力·弹簧测力计匀速拉动">
<div class="meta"><b>phy-012</b> · 探究滑动摩擦力·弹簧测力计匀速拉动</div>
<div class="asm">必须水平匀速拉动木块，此时拉力与摩擦力二力平衡，示数才等于摩擦力；加砝码改变压力、换表面改变粗糙程度（控制变量）</div></figure><figure class="card"><img src="../../public/atlas/phy-013.png" alt="探究滑动摩擦力·改变压力与接触面（生活化）">
<div class="meta"><b>phy-013</b> · 探究滑动摩擦力·改变压力与接触面（生活化）</div>
<div class="asm">同一木块加不同砝码，读数随之变大——说明摩擦力随压力增大；换粗糙表面读数变大——说明与接触面粗糙程度有关</div></figure><figure class="card"><img src="../../public/atlas/phy-014.png" alt="探究压力作用效果·海绵与小桌">
<div class="meta"><b>phy-014</b> · 探究压力作用效果·海绵与小桌</div>
<div class="asm">用海绵是因为形变明显、便于比较（也可换沙子、橡皮泥）；同一小桌正放/倒放改变受力面积，加砝码改变压力；压力越大、受力面积越小，作用效果越明显</div></figure><figure class="card"><img src="../../public/atlas/phy-015.png" alt="探究液体内部压强·压强计">
<div class="meta"><b>phy-015</b> · 探究液体内部压强·压强计</div>
<div class="asm">U 形管两侧液面高度差反映压强大小（转换法）；同一深度朝各方向高度差相同；深度越大高度差越大；换盐水（密度大）高度差变大</div></figure><figure class="card"><img src="../../public/atlas/phy-016.png" alt="探究影响浮力大小的因素·称重法">
<div class="meta"><b>phy-016</b> · 探究影响浮力大小的因素·称重法</div>
<div class="asm">F浮=G−F示；物体浸入体积越大示数越小；浸没后继续下沉示数不变（浮力与深度无关）；换盐水示数更小（液体密度越大浮力越大）</div></figure><figure class="card"><img src="../../public/atlas/phy-017.png" alt="探究浮力与排开液体所受重力的关系·溢水杯">
<div class="meta"><b>phy-017</b> · 探究浮力与排开液体所受重力的关系·溢水杯</div>
<div class="asm">溢水杯要先装满水，否则排出的水偏少；先测空桶重力，再测桶和排开的水；结论 F浮=G排</div></figure><figure class="card"><img src="../../public/atlas/phy-019.png" alt="探究杠杆平衡的条件">
<div class="meta"><b>phy-019</b> · 探究杠杆平衡的条件</div>
<div class="asm">先调平衡螺母使杠杆在水平位置平衡（便于直接读力臂）；F1l1=F2l2；弹簧测力计斜拉时力臂变小、示数变大</div></figure><figure class="card"><img src="../../public/atlas/phy-020.png" alt="测量滑轮组的机械效率·s 与 h">
<div class="meta"><b>phy-020</b> · 测量滑轮组的机械效率·s 与 h</div>
<div class="asm">竖直匀速拉动弹簧测力计；s=nh；η=W有/W总=Gh/Fs；同一滑轮组提升的物重越大，机械效率越高</div></figure><figure class="card"><img src="../../public/atlas/phy-021.png" alt="三种滑轮组绕法对比（n=2/3）">
<div class="meta"><b>phy-021</b> · 三种滑轮组绕法对比（n=2/3）</div>
<div class="asm">同一重物、同一滑轮组，改变绕法只改变绳子段数 n（s=nh、F=G/n）；比较机械效率可以说明效率与绕法无关、与动滑轮重和摩擦有关</div></figure><figure class="card"><img src="../../public/atlas/phy-002.png" alt="声音的产生·音叉与乒乓球 / 真空罩闹钟">
<div class="meta"><b>phy-002</b> · 声音的产生·音叉与乒乓球 / 真空罩闹钟</div>
<div class="asm">乒乓球被弹开说明音叉在振动（把微小振动放大，转换法）；抽气后铃声变小、推理真空不能传声（实验+推理）</div></figure><figure class="card"><img src="../../public/atlas/phy-003.png" alt="探究音调与频率·钢尺伸出桌边">
<div class="meta"><b>phy-003</b> · 探究音调与频率·钢尺伸出桌边</div>
<div class="asm">钢尺伸出桌边越长，振动越慢、音调越低；拨动幅度越大，响度越大——音调由频率决定，响度由振幅决定</div></figure><figure class="card"><img src="../../public/atlas/phy-004.png" alt="探究固体熔化规律·水浴加热与图象">
<div class="meta"><b>phy-004</b> · 探究固体熔化规律·水浴加热与图象</div>
<div class="asm">水浴法让物质受热均匀、升温缓慢便于记录；温度计玻璃泡浸没在固体中且不碰管底管壁；晶体熔化时吸热但温度不变（图象有水平段），非晶体没有</div></figure><figure class="card"><img src="../../public/atlas/phy-005.png" alt="探究水沸腾时温度变化的特点">
<div class="meta"><b>phy-005</b> · 探究水沸腾时温度变化的特点</div>
<div class="asm">自下而上组装；温度计玻璃泡浸没水中不碰底壁；加纸板减少热损失；沸腾时继续吸热但温度不变；沸点随气压升高而升高</div></figure><figure class="card"><img src="../../public/atlas/phy-022.png" alt="比较不同物质的吸热能力·水与食用油">
<div class="meta"><b>phy-022</b> · 比较不同物质的吸热能力·水与食用油</div>
<div class="asm">用规格相同的电加热器（或相同酒精灯）保证相同时间吸收热量相同；取质量、初温相同的水和油；升温慢的比热容大</div></figure><figure class="card"><img src="../../public/atlas/phy-006.png" alt="探究光的反射规律·可折转纸板">
<div class="meta"><b>phy-006</b> · 探究光的反射规律·可折转纸板</div>
<div class="asm">纸板要竖直立在平面镜上；把纸板 NOF 向前或向后折，看不到反射光线——说明三线共面；反射角等于入射角，角都从法线量起</div></figure><figure class="card"><img src="../../public/atlas/phy-007.png" alt="探究凸透镜成像规律·光具座">
<div class="meta"><b>phy-007</b> · 探究凸透镜成像规律·光具座</div>
<div class="asm">蜡烛、凸透镜、光屏三者中心在同一高度；u>2f 成倒立缩小实像，f<u<2f 成倒立放大实像，u<f 成正立放大虚像（光屏上接不到）；u=f 不成像</div></figure><figure class="card"><img src="../../public/atlas/phy-008.png" alt="用天平和量筒测量固体的密度">
<div class="meta"><b>phy-008</b> · 用天平和量筒测量固体的密度</div>
<div class="asm">天平放水平台、游码归零、调平衡螺母；左物右码；量筒读数视线与凹液面最低处相平；先测质量后测体积，避免石块沾水使质量偏大</div></figure><figure class="card"><img src="../../public/atlas/phy-009.png" alt="用天平和量筒测量液体的密度">
<div class="meta"><b>phy-009</b> · 用天平和量筒测量液体的密度</div>
<div class="asm">先测烧杯和液体的总质量 m1，倒一部分进量筒读体积 V，再测剩余的质量 m2；ρ=(m1−m2)/V，这样避免液体残留量筒带来的误差</div></figure><figure class="card"><img src="../../public/atlas/phy-023.png" alt="探究导体电阻与材料、长度、横截面积的关系">
<div class="meta"><b>phy-023</b> · 探究导体电阻与材料、长度、横截面积的关系</div>
<div class="asm">把不同规格的合金丝依次接入电路，比较电流表示数（或灯泡亮度）反映电阻大小（转换法）；每次只改变一个因素（控制变量）</div></figure><figure class="card"><img src="../../public/atlas/phy-024.png" alt="探究电流与电压、电阻的关系（电路图+实物图）">
<div class="meta"><b>phy-024</b> · 探究电流与电压、电阻的关系（电路图+实物图）</div>
<div class="asm">滑动变阻器串联在电路中，闭合开关前滑片移到阻值最大处；探究 I-U 时保持 R 不变，探究 I-R 时保持定值电阻两端电压不变</div></figure><figure class="card"><img src="../../public/atlas/phy-025.png" alt="伏安法测电阻（电路图+实物图）">
<div class="meta"><b>phy-025</b> · 伏安法测电阻（电路图+实物图）</div>
<div class="asm">电压表并联在待测电阻两端、电流表串联；R=U/I；定值电阻多次测量求平均值以减小误差，小灯泡的电阻随温度变化不能求平均</div></figure><figure class="card"><img src="../../public/atlas/phy-026.png" alt="测量小灯泡的电功率（电路图+实物图）">
<div class="meta"><b>phy-026</b> · 测量小灯泡的电功率（电路图+实物图）</div>
<div class="asm">P=UI；移动滑片使电压表示数等于额定电压时测的就是额定功率；滑动变阻器既保护电路又改变灯泡两端电压</div></figure><figure class="card"><img src="../../public/atlas/phy-027.png" alt="探究电流的热效应·U 形管装置">
<div class="meta"><b>phy-027</b> · 探究电流的热效应·U 形管装置</div>
<div class="asm">U 形管两侧液面高度差反映产生热量的多少（转换法）；串联保证电流和通电时间相同，比较不同电阻；并联可比较不同电流</div></figure><figure class="card"><img src="../../public/atlas/phy-028.png" alt="探究电磁铁磁性强弱·匝数与电流">
<div class="meta"><b>phy-028</b> · 探究电磁铁磁性强弱·匝数与电流</div>
<div class="asm">吸引大头针的数量反映磁性强弱（转换法）；移动滑片改变电流看吸引起伏，换匝数不同的电磁铁比较——电流越大、匝数越多，磁性越强</div></figure></div><h2>原理图 / 光路图（principle）<span>15</span></h2><div class='grid'><figure class="card"><img src="../../public/atlas/phy-101.png" alt="光的反射定律（三线两角）">
<div class="meta"><b>phy-101</b> · 光的反射定律（三线两角）</div>
<div class="asm">法线是过入射点垂直于镜面的虚线；入射角、反射角都从法线量起；反射光线与入射光线分居法线两侧，反射角等于入射角，光路可逆</div></figure><figure class="card"><img src="../../public/atlas/phy-102.png" alt="光的折射（空气斜射入水）">
<div class="meta"><b>phy-102</b> · 光的折射（空气斜射入水）</div>
<div class="asm">光从空气斜射入水中时折射光线向法线偏折，折射角小于入射角；垂直入射时传播方向不变；折射时光路也可逆</div></figure><figure class="card"><img src="../../public/atlas/phy-103.png" alt="岸上看水变浅 / 水中看岸上变高">
<div class="meta"><b>phy-103</b> · 岸上看水变浅 / 水中看岸上变高</div>
<div class="asm">看到的都是折射形成的虚像：从岸上看水中物体，像的位置比实际浅；从水中看岸上物体，像的位置比实际高；画图时两条光线要都进入眼睛</div></figure><figure class="card"><img src="../../public/atlas/phy-104.png" alt="海市蜃楼成因">
<div class="meta"><b>phy-104</b> · 海市蜃楼成因</div>
<div class="asm">近地面温度高、上层温度低，空气密度（折射率）连续变化，光沿曲线传播；人眼仍按直线判断，于是看到远处景物的虚像</div></figure><figure class="card"><img src="../../public/atlas/phy-105.png" alt="光的色散·三棱镜分光">
<div class="meta"><b>phy-105</b> · 光的色散·三棱镜分光</div>
<div class="asm">白光通过三棱镜后分解为红橙黄绿蓝靛紫；紫光偏折程度最大、红光最小；说明白光是复色光（不同色光折射率不同）</div></figure><figure class="card"><img src="../../public/atlas/phy-106.png" alt="凸透镜与凹透镜（会聚/发散）">
<div class="meta"><b>phy-106</b> · 凸透镜与凹透镜（会聚/发散）</div>
<div class="asm">凸透镜中间厚边缘薄，对光有会聚作用；凹透镜中间薄边缘厚，对光有发散作用；画图时平行于主光轴的光线过焦点（或其反向延长线过虚焦点）</div></figure><figure class="card"><img src="../../public/atlas/phy-107.png" alt="影子的形成（光的直线传播）">
<div class="meta"><b>phy-107</b> · 影子的形成（光的直线传播）</div>
<div class="asm">光沿直线传播，不透明物体挡住光线在其后形成影子；影子边界由光源大小决定——点光源影子清晰</div></figure><figure class="card"><img src="../../public/atlas/phy-108.png" alt="小孔成像">
<div class="meta"><b>phy-108</b> · 小孔成像</div>
<div class="asm">光沿直线传播，上部的光射到屏的下部，所以像是倒立的实像；像的形状与孔的形状无关，孔越小像越清晰、越暗</div></figure><figure class="card"><img src="../../public/atlas/phy-109.png" alt="日食的成因">
<div class="meta"><b>phy-109</b> · 日食的成因</div>
<div class="asm">月球运行到太阳和地球之间，挡住了射向地球的太阳光；本影区看到日全食，半影区看到日偏食</div></figure><figure class="card"><img src="../../public/atlas/phy-110.png" alt="月食的成因">
<div class="meta"><b>phy-110</b> · 月食的成因</div>
<div class="asm">地球运行到太阳和月球之间，地球的影子落在月球上；月球进入本影区发生月全食，进入半影区发生月偏食</div></figure><figure class="card"><img src="../../public/atlas/phy-111.png" alt="镜面反射">
<div class="meta"><b>phy-111</b> · 镜面反射</div>
<div class="asm">平行光射到光滑表面后反射光仍平行，只有处在反射光方向的人才能看到刺眼的光；镜面反射同样遵守反射定律</div></figure><figure class="card"><img src="../../public/atlas/phy-112.png" alt="漫反射">
<div class="meta"><b>phy-112</b> · 漫反射</div>
<div class="asm">凹凸不平的表面把平行光反射到各个方向，所以能从各个角度看到不发光的物体；每条光线仍遵守反射定律</div></figure><figure class="card"><img src="../../public/atlas/phy-113.png" alt="平面镜成像（等大等距虚像）">
<div class="meta"><b>phy-113</b> · 平面镜成像（等大等距虚像）</div>
<div class="asm">像与物大小相等、到镜面距离相等、连线与镜面垂直、是虚像（光屏接不到）；实验用玻璃板代替平面镜是为了看到背后的蜡烛、确定像的位置</div></figure><figure class="card"><img src="../../public/atlas/phy-114.png" alt="凹面镜（对光有会聚作用）">
<div class="meta"><b>phy-114</b> · 凹面镜（对光有会聚作用）</div>
<div class="asm">平行光射到凹面镜上被会聚到焦点；应用：太阳灶、手电筒反光碗、汽车前灯（把光源放在焦点上得到平行光）</div></figure><figure class="card"><img src="../../public/atlas/phy-115.png" alt="凸面镜（对光有发散作用）">
<div class="meta"><b>phy-115</b> · 凸面镜（对光有发散作用）</div>
